# 신기능 제안 PR에 자동 검토 댓글을 단다. 기준: docs/eval/proposal-rubric.md
# 필요한 비밀값: CLAUDE_CODE_OAUTH_TOKEN (레포 관리자가 claude 터미널에서 /install-github-app 으로 등록)
# claude-code-action은 한글 브랜치 이름을 거부해서(팀 규칙: 이름/한글주제) Claude Code를 직접 실행한다.
name: 신기능 제안 자동 검토

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["docs/proposals/**"]

concurrency:
  group: proposal-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 공개 레포라 외부 포크 PR에서는 돌리지 않는다. 팀원은 같은 레포 브랜치로 PR을 연다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude로 제안서 검토
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx -y @anthropic-ai/claude-code -p \
            ".claude/skills/review-proposal/SKILL.md 를 읽고 PR 모드로 따른다. 대상: PR #${PR_NUMBER} (레포 ${GITHUB_REPOSITORY}). 댓글 본문 파일은 ${RUNNER_TEMP} 아래에 쓴다." \
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)" \
            --add-dir "$RUNNER_TEMP" \
            --max-turns 40
