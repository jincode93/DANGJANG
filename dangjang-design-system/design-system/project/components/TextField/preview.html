<!doctype html>
<html lang="ko"><head><meta charset="utf-8"></head><body>
<div class="dj-stack">
  <div class="dj-field">
    <label for="f1">어깨 너비</label>
    <div class="dj-input"><input id="f1" inputmode="decimal" value="46"><span class="dj-unit">cm</span></div>
    <span class="dj-help">옷을 평평하게 놓고 어깨 끝에서 끝까지 재요.</span>
  </div>
  <div class="dj-field dj-field--error">
    <label for="f2">총장</label>
    <div class="dj-input"><input id="f2" inputmode="decimal" value="7"><span class="dj-unit">cm</span></div>
    <span class="dj-help">총장은 30cm보다 길어야 해요. 다시 재 볼까요?</span>
  </div>
</div>
</body></html>
